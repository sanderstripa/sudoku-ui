name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath .
      - run: bash -n install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
