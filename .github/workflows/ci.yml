name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath .
      - run: bash -n install.sh
      - name: Verify published Core used by installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/sanderstripa/sudoku-ui/releases?per_page=30' | jq -c '[.[]|select(.tag_name|startswith("core-v"))][0]')
          mkdir -p /tmp/installer-core-check
          cd /tmp/installer-core-check
          for name in sudoku-core-linux-amd64.tar.gz sudoku-core-linux-amd64.tar.gz.sha256; do
            url=$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.browser_download_url' <<<"$release")
            curl -fsSL "$url" -o "$name"
          done
          sha256sum -c sudoku-core-linux-amd64.tar.gz.sha256
          tar -xzf sudoku-core-linux-amd64.tar.gz sudoku
          output=$(./sudoku -keygen 2>&1)
          grep -q 'Master Public Key:' <<<"$output"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/game.js
