<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .card { @apply bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6; }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen text-gray-900 dark:text-gray-100">

<!-- Login -->
<div id="login-page" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">Sudoku UI</h1>
      <p class="text-gray-500 mt-2">Панель управления VPN</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Логин</label>
        <input type="text" id="username" value="admin" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Пароль</label>
        <input type="password" id="password" value="admin" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
        Войти
      </button>
      <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl font-bold text-indigo-600">Sudoku UI</span>
        <span id="version-badge" class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded"></span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="updateCore()" class="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg">
          Обновить ядро
        </button>
        <button onclick="logout()" class="text-sm text-gray-500 hover:text-red-500">Выйти</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <!-- Status -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow">
        <div class="text-sm text-gray-500">Статус Sudoku</div>
        <div id="status-running" class="text-2xl font-semibold mt-1">—</div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow">
        <div class="text-sm text-gray-500">Публичный IP</div>
        <div id="status-ip" class="text-2xl font-semibold mt-1">—</div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow">
        <div class="text-sm text-gray-500">Клиентов</div>
        <div id="status-clients" class="text-2xl font-semibold mt-1">0</div>
      </div>
    </div>

    <!-- Create Client -->
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow">
      <h2 class="text-lg font-semibold mb-4">Создать клиента</h2>
      <form id="create-form" class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="client-name" placeholder="Имя клиента" required
               class="flex-1 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="text" id="client-remark" placeholder="Заметка (необязательно)"
               class="flex-1 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium">
          Создать
        </button>
      </form>
    </div>

    <!-- Clients List -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold">Клиенты / Инбаунды</h2>
      </div>
      <div id="clients-list" class="divide-y divide-gray-200 dark:divide-gray-700">
        <div class="p-6 text-center text-gray-500">Загрузка...</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal for link -->
<div id="link-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold">Ссылка клиента</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    <div id="modal-name" class="text-sm text-gray-500 mb-3"></div>
    <div class="bg-gray-100 dark:bg-gray-900 rounded-lg p-3 mb-4 break-all font-mono text-sm" id="modal-link"></div>
    <div class="flex justify-center mb-4">
      <canvas id="qrcode"></canvas>
    </div>
    <div class="flex gap-2">
      <button onclick="copyAll()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg">Копировать все</button>
      <button onclick="copyLink()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg">Копировать</button>
      <button onclick="closeModal()" class="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-lg">Закрыть</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('token') || '';
let currentLink = '';

function authHeaders() {
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { ...authHeaders(), ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    logout();
    throw new Error('unauthorized');
  }
  return res.json();
}

// Login
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Ошибка входа';
      errEl.classList.remove('hidden');
      return;
    }
    token = data.token;
    localStorage.setItem('token', token);
    showApp();
  } catch (err) {
    errEl.textContent = 'Ошибка сети';
    errEl.classList.remove('hidden');
  }
});

function logout() {
  token = '';
  localStorage.removeItem('token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
}

function showApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadStatus();
  loadClients();
}

// Status
async function loadStatus() {
  try {
    const s = await api('/status');
    document.getElementById('status-running').textContent = s.sudoku_running ? '🟢 Работает' : '🔴 Остановлен';
    document.getElementById('status-ip').textContent = s.public_ip || '—';
    document.getElementById('version-badge').textContent = 'v' + (s.panel_version || '?');
  } catch {}
}

// Clients
async function loadClients() {
  const el = document.getElementById('clients-list');
  try {
    const list = await api('/clients');
    document.getElementById('status-clients').textContent = list.length;
    if (!list.length) {
      el.innerHTML = '<div class="p-8 text-center text-gray-500">Пока нет клиентов. Создайте первого!</div>';
      return;
    }
    el.innerHTML = list.map(c => `
      <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-gray-50 dark:hover:bg-gray-750">
        <div>
          <div class="font-medium">${escapeHtml(c.name)}</div>
          <div class="text-xs text-gray-500 mt-0.5">
            ${c.user_hash} · ${new Date(c.created_at).toLocaleString('ru')}
            ${c.remark ? ' · ' + escapeHtml(c.remark) : ''}
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="showLink(${c.id}, '${escapeHtml(c.name)}')" class="text-sm bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 px-3 py-1.5 rounded-lg hover:bg-indigo-200">
            Ссылка
          </button>
          <button onclick="deleteClient(${c.id})" class="text-sm bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 px-3 py-1.5 rounded-lg hover:bg-red-200">
            Удалить
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = '<div class="p-6 text-red-500">Ошибка загрузки</div>';
  }
}

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('client-name').value.trim();
  const remark = document.getElementById('client-remark').value.trim();
  if (!name) return;

  try {
    await api('/clients', {
      method: 'POST',
      body: JSON.stringify({ name, remark })
    });
    document.getElementById('client-name').value = '';
    document.getElementById('client-remark').value = '';
    loadClients();
  } catch (err) {
    alert('Ошибка создания: ' + err.message);
  }
});

async function deleteClient(id) {
  if (!confirm('Удалить клиента?')) return;
  try {
    await api('/clients/' + id, { method: 'DELETE' });
    loadClients();
  } catch (e) {
    alert('Ошибка удаления');
  }
}

let currentCreds = {};

async function showLink(id, name) {
  try {
    const data = await api('/clients/' + id + '/link');
    currentLink = data.short_link || '';
    currentCreds = data.credentials || {};
    document.getElementById('modal-name').textContent = name;

    const c = currentCreds;
    const rows = [
      ['Тип', 'Sudoku'],
      ['Адрес', c.address || '—'],
      ['Порт', c.port || '—'],
      ['Пароль (ключ)', c.password || '—'],
      ['Метод', c.method || 'chacha20-poly1305'],
      ['Тип таблицы', c.ascii || 'prefer_entropy'],
      ['Padding min', c.padding_min ?? 5],
      ['Padding max', c.padding_max ?? 15],
      ['Pure Downlink', c.pure_downlink ? 'Да' : 'Нет'],
      ['HTTP-маскировка', c.http_mask ? 'Вкл' : 'Выкл'],
    ];

    let box = document.getElementById('creds-box');
    if (!box) {
      // вставляем блок если его нет в старой вёрстке
      const linkEl = document.getElementById('modal-link');
      box = document.createElement('div');
      box.id = 'creds-box';
      box.className = 'space-y-1 text-sm mb-4';
      linkEl.parentNode.insertBefore(box, linkEl);
    }
    box.innerHTML = rows.map(([k,v]) =>
      '<div class="flex justify-between gap-3 py-1.5 border-b border-gray-100">' +
      '<span class="text-gray-500 shrink-0">' + k + '</span>' +
      '<span class="font-mono text-right break-all text-xs">' + String(v).replace(/</g,'&lt;') + '</span></div>'
    ).join('');

    document.getElementById('modal-link').textContent = currentLink || (data.error || '—');

    const canvas = document.getElementById('qrcode');
    if (canvas && currentLink && window.QRCode) {
      QRCode.toCanvas(canvas, currentLink, { width: 160, margin: 1 });
    }

    document.getElementById('link-modal').classList.remove('hidden');
    document.getElementById('link-modal').classList.add('flex');
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

function copyAll() {
  const c = currentCreds || {};
  const text = [
    'Тип: Sudoku',
    'Адрес: ' + (c.address || ''),
    'Порт: ' + (c.port || ''),
    'Пароль: ' + (c.password || ''),
    'Метод: ' + (c.method || 'chacha20-poly1305'),
    'Тип таблицы: ' + (c.ascii || 'prefer_entropy'),
    'Padding min: ' + (c.padding_min ?? 5),
    'Padding max: ' + (c.padding_max ?? 15),
    '',
    currentLink || ''
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Скопировано!'));
}

function closeModal() {
  document.getElementById('link-modal').classList.add('hidden');
  document.getElementById('link-modal').classList.remove('flex');
}

function copyLink() {
  if (!currentLink) return;
  navigator.clipboard.writeText(currentLink).then(() => {
    alert('Скопировано!');
  });
}

async function updateCore() {
  if (!confirm('Обновить ядро Sudoku до последней версии?')) return;
  try {
    const data = await api('/update-core', { method: 'POST' });
    alert('Ядро обновлено: ' + (data.version || 'ok'));
    loadStatus();
  } catch (e) {
    alert('Ошибка обновления: ' + (e.message || e));
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
if (token) {
  // Проверяем токен
  api('/status').then(() => showApp()).catch(() => logout());
}
</script>
</body>
</html>
