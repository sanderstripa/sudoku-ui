<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { DEFAULT: '#3b82f6', dark: '#2563eb', light: '#60a5fa' }
      }
    }
  }
}
</script>
<style>
  body { font-family: Inter, system-ui, -apple-system, sans-serif; }
  .sidebar-link.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
  .sidebar-link:hover { background: #f1f5f9; }
  #login-page {
    background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 40%, #f0f9ff 70%, #faf5ff 100%);
  }
  .stat-card { transition: box-shadow .15s; }
  .stat-card:hover { box-shadow: 0 4px 12px rgba(59,130,246,.12); }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<!-- ========== LOGIN ========== -->
<div id="login-page" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white/90 backdrop-blur rounded-2xl shadow-xl p-8 w-full max-w-md border border-white/60">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold tracking-wide" style="color:#8b5cf6">SUDOKU UI</div>
      <div class="w-12 h-0.5 bg-violet-400 mx-auto mt-2 mb-4"></div>
      <h2 class="text-xl font-semibold text-slate-800">Добро пожаловать!</h2>
    </div>
    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm text-slate-500 mb-1.5">Имя пользователя</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </span>
          <input type="text" id="username" value="admin" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition">
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-500 mb-1.5">Пароль</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </span>
          <input type="password" id="password" value="admin" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition">
        </div>
      </div>
      <div id="login-error" class="text-red-500 text-sm hidden"></div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm shadow-blue-200">
        Войти
      </button>
    </form>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hidden min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-slate-100">
      <div class="text-lg font-bold text-blue-600 tracking-tight">Sudoku UI</div>
      <div class="text-xs text-slate-400 mt-0.5">v0.1.0</div>
    </div>
    <nav class="flex-1 py-3 px-2 space-y-0.5">
      <a href="#" onclick="showPage('dashboard')" id="nav-dashboard" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
        Дашборд
      </a>
      <a href="#" onclick="showPage('clients')" id="nav-clients" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Клиенты
      </a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button onclick="logout()" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-500 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Выход
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span id="core-badge" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-500">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400" id="core-dot"></span>
          <span id="core-status-text">—</span>
        </span>
        <span class="text-xs text-slate-400" id="panel-ver"></span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="updateCore()" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 transition">Обновить ядро</button>
      </div>
    </header>

    <main class="flex-1 p-6 overflow-auto">

      <!-- Dashboard -->
      <div id="page-dashboard">
        <h1 class="text-lg font-semibold mb-5">Дашборд</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="stat-card bg-white rounded-xl border border-slate-200 p-5">
            <div class="text-xs text-slate-400 mb-1">Статус Sudoku</div>
            <div class="text-xl font-semibold" id="dash-status">—</div>
          </div>
          <div class="stat-card bg-white rounded-xl border border-slate-200 p-5">
            <div class="text-xs text-slate-400 mb-1">Публичный IP</div>
            <div class="text-xl font-semibold font-mono" id="dash-ip">—</div>
          </div>
          <div class="stat-card bg-white rounded-xl border border-slate-200 p-5">
            <div class="text-xs text-slate-400 mb-1">Клиентов</div>
            <div class="text-xl font-semibold" id="dash-clients">—</div>
          </div>
          <div class="stat-card bg-white rounded-xl border border-slate-200 p-5">
            <div class="text-xs text-slate-400 mb-1">VPN порт</div>
            <div class="text-xl font-semibold" id="dash-port">44300</div>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="text-sm font-medium mb-3">Быстрые действия</div>
          <div class="flex flex-wrap gap-2">
            <button onclick="showPage('clients')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition">+ Создать клиента</button>
            <button onclick="updateCore()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-sm rounded-lg transition">Обновить ядро</button>
          </div>
        </div>
      </div>

      <!-- Clients -->
      <div id="page-clients" class="hidden">
        <div class="flex items-center justify-between mb-5">
          <h1 class="text-lg font-semibold">Клиенты</h1>
          <button onclick="document.getElementById('create-form').classList.toggle('hidden')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition">+ Добавить клиента</button>
        </div>

        <!-- Create form -->
        <div id="create-form" class="hidden bg-white rounded-xl border border-slate-200 p-5 mb-5">
          <form onsubmit="createClient(event)" class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[160px]">
              <label class="block text-xs text-slate-400 mb-1">Имя</label>
              <input id="new-name" required placeholder="my-phone" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
            </div>
            <div class="flex-1 min-w-[160px]">
              <label class="block text-xs text-slate-400 mb-1">Примечание</label>
              <input id="new-remark" placeholder="опционально" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
            </div>
            <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition">Создать</button>
          </form>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
              <tr>
                <th class="text-left px-4 py-3 font-medium">Клиент</th>
                <th class="text-left px-4 py-3 font-medium hidden sm:table-cell">Hash</th>
                <th class="text-left px-4 py-3 font-medium hidden md:table-cell">Создан</th>
                <th class="text-right px-4 py-3 font-medium">Действия</th>
              </tr>
            </thead>
            <tbody id="clients-body" class="divide-y divide-slate-100">
            </tbody>
          </table>
          <div id="clients-empty" class="hidden text-center py-12 text-slate-400 text-sm">Нет клиентов</div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal -->
<div id="link-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full my-8">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="font-semibold">Учётные данные</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-4">
      <div id="modal-name" class="text-sm font-medium text-blue-600 mb-4"></div>
      <div id="creds-box" class="space-y-0 text-sm mb-4"></div>
      <div class="mb-3">
        <div class="text-xs text-slate-400 mb-1">sudoku:// ссылка</div>
        <div class="bg-slate-50 rounded-lg p-3 break-all font-mono text-xs border border-slate-100" id="modal-link"></div>
      </div>
      <div class="flex justify-center mb-4">
        <canvas id="qrcode"></canvas>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 flex flex-col gap-2">
      <button onclick="copyAll()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition">Копировать все данные</button>
      <button onclick="copyLink()" class="w-full border border-slate-200 hover:bg-slate-50 py-2 rounded-lg text-sm transition">Копировать только ссылку</button>
      <button onclick="closeModal()" class="w-full text-slate-400 py-1.5 text-sm">Закрыть</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('token') || '';
let currentLink = '';
let currentCreds = {};

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api' + path, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auth
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.classList.add('hidden');
  try {
    const data = await api('/login', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    token = data.token;
    localStorage.setItem('token', token);
    showApp();
  } catch (ex) {
    err.textContent = ex.message || 'Ошибка входа';
    err.classList.remove('hidden');
  }
};

function logout() {
  token = '';
  localStorage.removeItem('token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
}

function showApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  showPage('dashboard');
  refreshStatus();
  loadClients();
}

function showPage(name) {
  document.getElementById('page-dashboard').classList.toggle('hidden', name !== 'dashboard');
  document.getElementById('page-clients').classList.toggle('hidden', name !== 'clients');
  document.getElementById('nav-dashboard').classList.toggle('active', name === 'dashboard');
  document.getElementById('nav-clients').classList.toggle('active', name === 'clients');
  if (name === 'clients') loadClients();
}

async function refreshStatus() {
  try {
    const s = await api('/status');
    const running = s.sudoku_running;
    document.getElementById('dash-status').textContent = running ? 'Запущен' : 'Остановлен';
    document.getElementById('dash-status').className = 'text-xl font-semibold ' + (running ? 'text-emerald-600' : 'text-red-500');
    document.getElementById('dash-ip').textContent = s.public_ip || '—';
    document.getElementById('dash-port').textContent = s.server_port || '44300';
    document.getElementById('panel-ver').textContent = s.panel_version || '';

    const badge = document.getElementById('core-badge');
    const dot = document.getElementById('core-dot');
    const txt = document.getElementById('core-status-text');
    if (running) {
      badge.className = 'inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700';
      dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
      txt.textContent = 'Sudoku · Запущен';
    } else {
      badge.className = 'inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-red-50 text-red-600';
      dot.className = 'w-1.5 h-1.5 rounded-full bg-red-400';
      txt.textContent = 'Sudoku · Остановлен';
    }
  } catch (_) {}
}

async function loadClients() {
  try {
    const list = await api('/clients');
    document.getElementById('dash-clients').textContent = list.length;
    const body = document.getElementById('clients-body');
    const empty = document.getElementById('clients-empty');
    if (!list.length) {
      body.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    body.innerHTML = list.map(c => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3">
          <div class="font-medium">${escapeHtml(c.name)}</div>
          ${c.remark ? '<div class="text-xs text-slate-400">' + escapeHtml(c.remark) + '</div>' : ''}
        </td>
        <td class="px-4 py-3 font-mono text-xs text-slate-400 hidden sm:table-cell">${escapeHtml(c.user_hash || '')}</td>
        <td class="px-4 py-3 text-xs text-slate-400 hidden md:table-cell">${(c.created_at || '').slice(0,16).replace('T',' ')}</td>
        <td class="px-4 py-3 text-right space-x-1">
          <button onclick="showLink(${c.id}, '${escapeHtml(c.name)}')" class="text-xs px-2.5 py-1 rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 transition">Ссылка</button>
          <button onclick="deleteClient(${c.id})" class="text-xs px-2.5 py-1 rounded-md bg-red-50 text-red-500 hover:bg-red-100 transition">Удалить</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

async function createClient(e) {
  e.preventDefault();
  const name = document.getElementById('new-name').value.trim();
  const remark = document.getElementById('new-remark').value.trim();
  if (!name) return;
  try {
    await api('/clients', { method: 'POST', body: JSON.stringify({ name, remark }) });
    document.getElementById('new-name').value = '';
    document.getElementById('new-remark').value = '';
    document.getElementById('create-form').classList.add('hidden');
    loadClients();
  } catch (ex) {
    alert('Ошибка: ' + ex.message);
  }
}

async function deleteClient(id) {
  if (!confirm('Удалить клиента?')) return;
  try {
    await api('/clients/' + id, { method: 'DELETE' });
    loadClients();
  } catch (ex) {
    alert(ex.message);
  }
}

async function showLink(id, name) {
  try {
    const data = await api('/clients/' + id + '/link');
    currentLink = data.short_link || '';
    currentCreds = data.credentials || {};
    document.getElementById('modal-name').textContent = name;

    const c = currentCreds;
    const rows = [
      ['Тип', 'Sudoku'],
      ['Адрес', c.address || '—'],
      ['Порт', c.port || '—'],
      ['Пароль (ключ)', c.password || '—'],
      ['Метод', c.method || 'chacha20-poly1305'],
      ['Тип таблицы', c.ascii || 'prefer_entropy'],
      ['Padding min', c.padding_min ?? 5],
      ['Padding max', c.padding_max ?? 15],
      ['Pure Downlink', c.pure_downlink ? 'Да' : 'Нет'],
      ['HTTP-маскировка', c.http_mask ? 'Вкл' : 'Выкл'],
    ];
    document.getElementById('creds-box').innerHTML = rows.map(([k,v]) =>
      `<div class="flex justify-between gap-3 py-2 border-b border-slate-50">
        <span class="text-slate-400 shrink-0 text-xs">${k}</span>
        <span class="font-mono text-right break-all text-xs">${escapeHtml(String(v))}</span>
      </div>`
    ).join('');

    document.getElementById('modal-link').textContent = currentLink || (data.error || '—');

    const canvas = document.getElementById('qrcode');
    if (currentLink && window.QRCode) {
      QRCode.toCanvas(canvas, currentLink, { width: 160, margin: 1, color: { dark: '#1e293b', light: '#ffffff' } });
    }

    document.getElementById('link-modal').classList.remove('hidden');
    document.getElementById('link-modal').classList.add('flex');
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

function closeModal() {
  document.getElementById('link-modal').classList.add('hidden');
  document.getElementById('link-modal').classList.remove('flex');
}

function copyLink() {
  if (!currentLink) return;
  navigator.clipboard.writeText(currentLink).then(() => alert('Ссылка скопирована'));
}

function copyAll() {
  const c = currentCreds || {};
  const text = [
    'Тип: Sudoku',
    'Адрес: ' + (c.address || ''),
    'Порт: ' + (c.port || ''),
    'Пароль: ' + (c.password || ''),
    'Метод: ' + (c.method || 'chacha20-poly1305'),
    'Тип таблицы: ' + (c.ascii || 'prefer_entropy'),
    'Padding min: ' + (c.padding_min ?? 5),
    'Padding max: ' + (c.padding_max ?? 15),
    '',
    currentLink || ''
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Скопировано!'));
}

async function updateCore() {
  if (!confirm('Обновить ядро Sudoku?')) return;
  try {
    const r = await api('/update-core', { method: 'POST' });
    alert('Обновлено: ' + (r.version || 'ok'));
    refreshStatus();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

// Init
if (token) {
  api('/status').then(() => showApp()).catch(() => logout());
} else {
  document.getElementById('login-page').classList.remove('hidden');
}
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
