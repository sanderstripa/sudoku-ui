<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>Sudoku UI</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="styles.css"></head><body>
<section id="loginView" class="login hidden"><form id="loginForm" class="card login-card"><div class="brand"><img src="icon.png"><b>Sudoku UI</b></div><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="signInHint"></p><label><span data-i18n="username"></span><input id="loginUser" autocomplete="username" required></label><label><span data-i18n="password"></span><input id="loginPass" type="password" autocomplete="current-password" required></label><button class="primary wide" data-i18n="signIn"></button><div id="loginError" class="error"></div></form></section>
<div id="app" class="hidden"><header><div class="shell header-inner"><div class="brand"><img src="icon.png"><b>Sudoku UI</b><button id="health" class="health" aria-label="Status"><i></i><span></span></button></div><div class="head-actions"><button id="versions" class="version-trigger"></button><button class="icon-btn" data-action="logs" data-tip="logs"></button><button class="icon-btn" data-action="theme" data-tip="theme"></button><button class="lang" data-action="lang">RU</button><button class="icon-btn" data-action="logout" data-tip="logout"></button></div></div></header>
<main class="shell"><section id="setupView" class="card setup hidden"><span class="eyebrow" data-i18n="firstSetup"></span><h1 data-i18n="createConnection"></h1><p class="muted" data-i18n="setupHint"></p><div id="setupForm"></div></section>
<section id="homeView" class="hidden"><article class="card connection"><div><span class="eyebrow" data-i18n="connection"></span><h1 id="connectionName"></h1><p id="connectionSubtitle" class="muted"></p><div id="connectionFields" class="connection-fields"></div><button class="secondary edit-connection" data-action="edit-connection"></button></div><aside id="connectionInfo"></aside></article><article class="card keys"><div class="section-head"><div><h2 data-i18n="accessKeys"></h2><p class="muted" data-i18n="keysHint"></p></div><button class="primary" data-action="new-key"><span data-i18n="newKey"></span></button></div><div id="keysList" class="key-list"></div></article><footer id="metrics" class="card metric-bar"></footer></section></main></div>
<div id="modalBackdrop" class="backdrop hidden"><div id="modal" class="modal"><button id="modalClose" class="close">×</button><div id="modalContent"></div></div></div><div id="anchored" class="anchored hidden"></div><div id="toast" class="toast hidden"></div><script src="help.js"></script><script src="app.js"></script></body></html>
