<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B"><title>Sudoku UI</title><script src="theme-init.js"></script><link rel="icon" href="icon-dark.png" type="image/png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="compact.css"></head><body>
<section id="loginView" class="login hidden"><div class="login-tools"><button class="icon-btn" data-action="theme" data-tip="theme"></button><button class="lang" data-action="lang">RU</button></div><form id="loginForm" class="login-card"><div class="login-heading"><div class="brand"><img src="icon.png"><b>Sudoku UI</b></div><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="signInHint"></p></div><label class="login-field"><span class="login-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><span class="sr-only" data-i18n="username"></span><input id="loginUser" autocomplete="username" data-i18n-placeholder="username" required></label><label class="login-field"><span class="login-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span class="sr-only" data-i18n="password"></span><input id="loginPass" type="password" autocomplete="current-password" data-i18n-placeholder="password" required><button id="passwordToggle" class="password-toggle" type="button" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></label><div class="login-bottom"><label class="remember"><input id="loginRemember" type="checkbox"><span class="remember-mark">✓</span><span data-login-remember>Запомнить</span></label><button class="primary login-submit"><span data-i18n="signIn"></span><span aria-hidden="true">›</span></button></div><div id="loginError" class="error"></div></form></section>
<div id="app" class="hidden"><header><div class="shell header-inner"><div class="brand"><img src="icon.png"><b>Sudoku UI</b><button id="health" class="health"><i></i></button></div><div class="head-actions"><button id="coreVersion" class="version-trigger" data-version="core"></button><button id="panelVersion" class="version-trigger" data-version="panel"></button><button class="icon-btn" data-action="logs" data-tip="logs"></button><button class="icon-btn" data-action="theme" data-tip="theme"></button><button class="lang" data-action="lang">RU</button><button class="icon-btn" data-action="logout" data-tip="logout"></button></div></div></header>
<main class="shell"><section id="setupView" class="card setup hidden"><span class="eyebrow" data-i18n="firstSetup"></span><h1 data-i18n="createConnection"></h1><p class="muted" data-i18n="setupHint"></p><div id="setupForm"></div></section><section id="homeView" class="hidden"><article class="card connection"><div class="connection-top"><div><h1 id="connectionName"></h1><p id="connectionSubtitle" class="muted"></p></div><button class="secondary edit-connection" data-action="edit-connection"></button></div><div id="connectionFields" class="connection-fields"></div></article><article class="card keys"><div class="section-head"><div><h2 data-i18n="accessKeys"></h2><p class="muted" data-i18n="keysHint"></p></div><button class="primary" data-action="new-key"><span data-i18n="newKey"></span></button></div><div id="keysList" class="key-list"></div></article><footer id="metrics" class="card metric-bar"></footer></section></main></div>
<div id="modalBackdrop" class="backdrop hidden"><div id="modal" class="modal"><button id="modalClose" class="close">×</button><div id="modalContent"></div></div></div><div id="anchored" class="anchored hidden"></div><div id="toast" class="toast hidden"></div><script src="help.js"></script><script src="app.js"></script></body></html>
