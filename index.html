<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Tango Sudoku</title><style>:root{--bg:#f6f7f9;--card:#fff;--soft:#eef1f5;--line:#d8dde5;--line2:#8b93a0;--text:#222936;--muted:#7a8596;--blue:#4d8de8;--blue2:#dceaff;--red:#e6535f;--red2:#fff0f1;--green:#32a06a;--shadow:0 10px 30px rgba(31,38,48,.05)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,select{font:inherit}body{padding:calc(10px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:0 auto}.radio-btn{width:100%;border:0;background:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.05);color:var(--text);text-align:left}.radio-state{width:12px;height:12px;border-radius:50%;background:#b3bac4;flex:0 0 auto}.radio-state.on{background:#d85b61;box-shadow:0 0 0 5px rgba(216,91,97,.12)}.radio-copy{min-width:0}.radio-title{font-size:16px;font-weight:760;line-height:1.2}.radio-sub{font-size:12px;color:#8c95a3;margin-top:2px}.radio-action{margin-left:auto;background:#eef1f5;color:#5d6674;border-radius:999px;padding:7px 12px;font-size:12px}.info-row{display:grid;grid-template-columns:minmax(120px,145px) 1fr auto;gap:10px;align-items:center;margin:10px 2px 10px}.level-wrap{position:relative}.level{appearance:none;border:0;background:#eceff3;border-radius:16px;min-height:44px;padding:0 38px 0 14px;font-weight:760;color:#2b3240;line-height:1;width:100%}.level-wrap:after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#5c6a80;font-size:17px;pointer-events:none}.timer{text-align:center;font-size:18px;font-weight:760;color:#445064;font-variant-numeric:tabular-nums;white-space:nowrap}.errors{justify-self:end;font-size:13px;color:#5f6978;display:flex;align-items:center;gap:7px;white-space:nowrap}.errors b{color:#253041}.dots{display:flex;gap:4px}.dot{width:10px;height:10px;border-radius:50%;background:#d9dee6}.dot.on{background:var(--red)}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #343a43;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:#49515c;font-size:clamp(22px,5.6vw,34px);font-weight:560}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell[data-c="2"],.cell[data-c="5"]{border-right:2px solid var(--line2)}.cell[data-r="2"],.cell[data-r="5"]{border-bottom:2px solid var(--line2)}.cell.rel{background:#f6f8fb}.cell.same{background:#edf3fb}.cell.sel{background:var(--blue2);box-shadow:inset 0 0 0 2px var(--blue)}.cell.user{color:#2b65b7;font-weight:720}.cell.err{color:var(--red);background:var(--red2);box-shadow:inset 0 0 0 2px rgba(230,83,95,.18)}.msg{min-height:12px;text-align:center;margin:4px 0 0;color:var(--muted);font-weight:650;font-size:14px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}.nums{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:4px;align-items:center}.num{width:min(100%,56px);aspect-ratio:1/1;min-height:0;justify-self:center;border:0;border-radius:50%;background:var(--soft);color:#222936;font-size:26px;font-weight:670}.num.chosen{background:var(--blue2);color:#2b65b7;box-shadow:inset 0 0 0 2px var(--blue)}.num.used{opacity:.28}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 0}.action-btn{border:0;background:#fff;border-radius:16px;min-height:50px;padding:0 10px;color:#293242;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.04)}.action-btn:active{transform:scale(.98)}.overlay,.win{position:fixed;inset:0;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:.25s}.overlay{z-index:60;background:rgba(15,18,24,.36);backdrop-filter:blur(8px)}.overlay.show,.win.show{opacity:1;pointer-events:auto}.modal{width:min(420px,100%);background:#fff;border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.18)}.modal h3{margin:0 0 8px;font-size:24px}.modal p{margin:0;color:#6b7280;line-height:1.5}.act{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.act button{border:0;border-radius:999px;padding:12px 16px}.prim{background:#222936;color:#fff;font-weight:700}.win{z-index:50;overflow:hidden;background:radial-gradient(circle at 50% 34%,rgba(203,150,80,.26),transparent 24%),radial-gradient(circle at 18% 22%,rgba(125,33,47,.42),transparent 36%),linear-gradient(135deg,#09080a,#1b0d12 54%,#0b090a)}.card{position:relative;width:min(680px,100%);padding:44px 26px 30px;border-radius:32px;border:1px solid rgba(230,199,142,.2);background:rgba(17,12,15,.67);backdrop-filter:blur(18px);color:#f8efe6;text-align:center;box-shadow:0 40px 110px rgba(0,0,0,.45)}.ey{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#d8b97e}.card h2{font-family:Georgia,serif;font-size:clamp(42px,12vw,78px);line-height:.96;letter-spacing:-.05em;font-weight:400;margin:18px 0}.card h2 em{display:block;color:#d5b272;font-weight:400}.card p{max-width:540px;margin:auto;color:#cfbec6;line-height:1.6}.result{margin-top:18px;color:#f4e8d7}.petal{position:absolute;top:-28px;width:6px;height:18px;border-radius:99px;background:linear-gradient(#d6b777,#7d2634);animation:fall linear infinite}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(720deg)}}@media(max-width:520px){.radio-title{font-size:15px}.info-row{grid-template-columns:minmax(115px,132px) auto auto;gap:8px}.timer{font-size:17px}.errors{font-size:12px;gap:6px}.num{width:100%;aspect-ratio:1/1;min-height:0;border-radius:50%;font-size:22px}.actions{gap:8px}.action-btn{min-height:46px;font-size:14px;padding:0 8px}}</style></head><body><div class="app"><button id="radioBtn" class="radio-btn" type="button"><span id="radioState" class="radio-state"></span><span class="radio-copy"><div class="radio-title">Tango Pasión Radio</div><div id="radioSub" class="radio-sub">нажми, чтобы включить эфир</div></span><span id="radioAction" class="radio-action">▶︎</span></button><audio id="radioAudio" preload="none" playsinline src="https://nr1.newradio.it:19180/stream"></audio><div class="info-row"><div class="level-wrap"><select id="level" class="level"><option value="easy">Лёгкий</option><option value="medium" selected>Средний</option><option value="hard">Сложный</option></select></div><div class="timer">◷ <span id="time">00:00</span></div><div class="errors">Ошибки: <b id="attemptText">0 / 5</b><span id="dots" class="dots"></span></div></div><div id="board" class="board"></div><div id="msg" class="msg"></div><div id="nums" class="nums"></div><div class="actions"><button id="newGame" class="action-btn">Новая игра</button><button id="reloadGame" class="action-btn">Перезагрузка</button><button id="hint" class="action-btn">Подсказка <span id="hintCount">4</span></button></div></div><div id="lose" class="overlay"><div class="modal"><div style="font-size:34px;line-height:1;margin-bottom:12px">✖</div><h3>Пять ошибок</h3><p>Попытки закончились. Начнём заново?</p><div class="act"><button class="prim" id="restart">Начать сначала</button></div></div></div><div id="win" class="win"><div class="card"><div class="ey">Tango anniversary</div><h2>С годовщиной <em>в танго!</em></h2><p>Пусть впереди будет ещё больше музыки, объятий, точных шагов и тех самых танцев, после которых хочется остаться ещё на одну танду.</p><div class="result" id="result"></div><div class="act"><button class="prim" id="again">Сыграть ещё</button><button id="back">Вернуться к полю</button></div></div></div><script>const PUZZLES={easy:["530070000600195000098000060800060003400803001700020006060000280000419005000080079","860010000900438000032000090200090006700206004100050009090000520000743008000020013"],medium:["000260701680070090190004500820100040004602900050003028009300074040050036703018000","000590104920010030430007800250400070007905300080006052003600017070080069106042000"],hard:["000000010400000000020000000000050407008000300001090000300400200050100000000806000","000000040700000000050000000000080701002000600004030000600700500080400000000209000"]};const $=id=>document.getElementById(id),B=$("board"),M=$("msg"),W=$("win"),L=$("lose"),audio=$("radioAudio");let puzzle="",solution="",vals=[],sel=-1,sec=0,timer=null,started=false,done=false,mistakes=0,hints=4,active=null,wrong=-1,initialVals=[];const maxMistakes=5;function solvePuzzle(p){const a=p.split("").map(Number);function ok(idx,n){const r=Math.floor(idx/9),c=idx%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let i=0;i<9;i++){if(a[r*9+i]===n)return false;if(a[i*9+c]===n)return false}for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)if(a[rr*9+cc]===n)return false;return true}function bt(){const idx=a.indexOf(0);if(idx===-1)return true;for(let n=1;n<=9;n++){if(ok(idx,n)){a[idx]=n;if(bt())return true;a[idx]=0}}return false}return bt()?a.join(""):null}for(let i=0;i<9;i++){const b=document.createElement("button");b.className="num";b.dataset.n=i+1;b.textContent=i+1;b.onclick=()=>{active=i+1;syncNums();draw();if(sel>=0&&puzzle[sel]==="0")put(i+1)};$("nums").appendChild(b)}for(let i=0;i<maxMistakes;i++){const d=document.createElement("span");d.className="dot";$("dots").appendChild(d)}function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function startTimer(){if(started||done)return;started=true;timer=setInterval(()=>{if(!done){sec++;$("time").textContent=fmt(sec)}},1000)}function msg(t,c=""){M.textContent=t;M.className="msg"+(c?" "+c:"");clearTimeout(msg.t);if(t)msg.t=setTimeout(()=>{if(!done&&!L.classList.contains("show")){M.textContent="";M.className="msg"}},1600)}function syncNums(){document.querySelectorAll(".num").forEach(b=>b.classList.toggle("chosen",Number(b.dataset.n)===active))}function setAttempts(){$("attemptText").textContent=mistakes+" / "+maxMistakes;[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i<mistakes))}function setNumStates(){for(let n=1;n<=9;n++){const c=vals.filter(v=>v===String(n)).length;document.querySelector('.num[data-n="'+n+'"]').classList.toggle("used",c>=9)}}function pickPuzzle(){const pool=PUZZLES[$("level").value];return pool[Math.floor(Math.random()*pool.length)]}function loadPuzzle(p){puzzle=p;solution=solvePuzzle(puzzle);if(!solution){msg("Ошибка набора судоку","err");return false;}vals=[...puzzle].map(v=>v==='0'?'':v);initialVals=[...vals];sel=-1;sec=0;started=false;done=false;mistakes=0;hints=4;active=null;wrong=-1;clearInterval(timer);$("time").textContent="00:00";$("hintCount").textContent=hints;W.classList.remove("show");L.classList.remove("show");setAttempts();setNumStates();syncNums();msg("");draw();return true}function newGame(){loadPuzzle(pickPuzzle())}function reloadGame(){vals=[...initialVals];sel=-1;sec=0;started=false;done=false;mistakes=0;hints=4;active=null;wrong=-1;clearInterval(timer);$("time").textContent="00:00";$("hintCount").textContent=hints;W.classList.remove("show");L.classList.remove("show");setAttempts();setNumStates();syncNums();msg("");draw()}function draw(){B.innerHTML="";vals.forEach((v,i)=>{const r=Math.floor(i/9),c=i%9,b=document.createElement("button");b.className="cell"+(puzzle[i]!=="0"?" fixed":v?" user":"");b.dataset.r=r;b.dataset.c=c;b.textContent=v;if(sel>=0){const sr=Math.floor(sel/9),sc=sel%9,sameBox=Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3);if(r===sr||c===sc||sameBox)b.classList.add("rel");if(i===sel)b.classList.add("sel");if(vals[sel]&&v===vals[sel])b.classList.add("same")}if(active&&v===String(active))b.classList.add("same");if(i===wrong)b.classList.add("err");b.onclick=()=>{sel=i;if(v){active=Number(v);syncNums()}startTimer();draw()};B.appendChild(b)})}function clearWrong(i){setTimeout(()=>{if(vals[i]!==solution[i])vals[i]="";if(wrong===i)wrong=-1;setNumStates();draw()},520)}function overIfNeeded(){setAttempts();if(mistakes>=maxMistakes){done=true;clearInterval(timer);L.classList.add("show");msg("Попытки закончились","err")}}function put(n){if(done||sel<0||puzzle[sel]!=="0")return;startTimer();const i=sel;vals[i]=String(n);active=Number(n);syncNums();if(String(n)!==solution[i]){wrong=i;mistakes=Math.min(maxMistakes,mistakes+1);msg("Неправильно — цифра убрана","err");draw();overIfNeeded();clearWrong(i);return}wrong=-1;draw();setNumStates();msg("Верно","ok");if(vals.every(Boolean))finish()}function hint(){if(done||hints<=0)return;let i=sel;if(i<0||puzzle[i]!=="0"||vals[i]===solution[i])i=vals.findIndex((v,k)=>puzzle[k]==="0"&&v!==solution[k]);if(i<0)return;vals[i]=solution[i];sel=i;active=Number(solution[i]);hints--;$("hintCount").textContent=hints;syncNums();setNumStates();draw();msg("Подсказка поставила правильную цифру","ok");if(vals.every(Boolean))finish()}function finish(){done=true;clearInterval(timer);$("result").textContent="Судоку решено за "+fmt(sec)+".";spawnPetals();W.classList.add("show")}function spawnPetals(){W.querySelectorAll(".petal").forEach(x=>x.remove());for(let i=0;i<26;i++){const p=document.createElement("i");p.className="petal";p.style.left=Math.random()*100+"vw";p.style.animationDuration=5+Math.random()*6+"s";p.style.animationDelay=-Math.random()*5+"s";p.style.setProperty("--x",-110+Math.random()*220+"px");W.appendChild(p)}}async function toggleRadio(){const state=$("radioState"),sub=$("radioSub"),action=$("radioAction");if(!audio.paused){audio.pause();state.classList.remove("on");sub.textContent="эфир выключен";action.textContent="▶︎";return}try{await audio.play();state.classList.add("on");sub.textContent="прямой эфир";action.textContent="Ⅱ"}catch(e){state.classList.remove("on");sub.textContent="не удалось запустить — нажми ещё раз";action.textContent="▶︎"}}audio.addEventListener("playing",()=>{$("radioState").classList.add("on");$("radioSub").textContent="прямой эфир";$("radioAction").textContent="Ⅱ"});audio.addEventListener("pause",()=>{$("radioState").classList.remove("on");$("radioAction").textContent="▶︎"});audio.addEventListener("error",()=>{$("radioState").classList.remove("on");$("radioSub").textContent="ошибка потока";$("radioAction").textContent="▶︎"});$("radioBtn").onclick=toggleRadio;$("newGame").onclick=newGame;$("reloadGame").onclick=reloadGame;$("hint").onclick=hint;$("restart").onclick=newGame;$("again").onclick=newGame;$("back").onclick=()=>W.classList.remove("show");$("level").onchange=newGame;document.addEventListener("keydown",e=>{if(/^[1-9]$/.test(e.key))put(e.key)});newGame();</script></body></html>
