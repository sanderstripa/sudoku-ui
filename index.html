<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Tango Sudoku</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--panel-soft:#f0f2f5;--line:#d8dde5;--line-strong:#8b93a0;--text:#222936;--muted:#8c95a3;--blue:#4d8de8;--blue-soft:#eaf2ff;--gold:#efb34f;--red:#e6535f;--red-soft:#fff0f1;--green:#3fa56d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,select{font:inherit}button{touch-action:manipulation}body{padding:calc(12px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom))}.app{width:min(720px,100%);margin:0 auto}.topbar{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;margin:4px 0 18px}.round{width:58px;height:58px;border:0;border-radius:50%;background:#eceef2;color:#20262f;display:grid;place-items:center;font-size:28px;cursor:pointer}.round.right{justify-self:end}.meta{text-align:center}.date{font-weight:750;font-size:22px;letter-spacing:-.02em}.timer{margin-top:2px;font-size:20px;color:#374151;font-variant-numeric:tabular-nums}.timer .clock{display:inline-block;width:18px;height:18px;border:2px solid #647080;border-radius:50%;vertical-align:-3px;margin-right:6px;position:relative}.timer .clock:after{content:"";position:absolute;width:2px;height:6px;background:#647080;left:7px;top:3px;border-radius:2px}.statusrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:6px 4px 10px}.streak{font-size:14px;color:#596274;display:flex;align-items:center;gap:7px}.streak b{color:var(--gold);font-size:18px}.levelwrap{position:relative}.level{appearance:none;border:0;background:#eceff3;border-radius:16px;padding:10px 38px 10px 16px;font-weight:760;font-size:17px;color:#2b3240;outline:0;cursor:pointer}.levelwrap:after{content:"⌄";position:absolute;right:14px;top:7px;color:#5c6a80;font-size:20px;pointer-events:none}.lives{justify-self:end;display:flex;gap:6px}.bolt{font-size:20px;color:#1f2329;transition:.2s}.bolt.lost{color:#d5d9df;opacity:.75}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:3px solid #343a43;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(31,38,48,.05)}.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;background:#fff;color:#4a4f58;display:grid;place-items:center;font-size:clamp(22px,5.6vw,34px);font-weight:560;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s,color .12s,transform .08s}.cell:active{transform:scale(.97)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell[data-c="2"],.cell[data-c="5"]{border-right:2px solid var(--line-strong)}.cell[data-r="2"],.cell[data-r="5"]{border-bottom:2px solid var(--line-strong)}.cell.rel{background:#f6f8fb}.cell.same{background:#edf3fb}.cell.sel{background:#dceaff;box-shadow:inset 0 0 0 2px var(--blue)}.cell.user{color:#2b65b7;font-weight:720}.cell.err{color:var(--red);background:var(--red-soft);animation:wrong .28s ease}.cell.err.sel{box-shadow:inset 0 0 0 2px var(--red)}@keyframes wrong{0%{transform:scale(.88)}55%{transform:scale(1.08)}100%{transform:scale(1)}}.error-note{min-height:24px;text-align:center;margin:10px 0 2px;color:var(--red);font-weight:650;font-size:14px;transition:.2s}.error-note.ok{color:var(--green)}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 4px 0}.num{border:0;background:#eef1f5;border-radius:18px;min-height:64px;color:#222936;font-weight:650;font-size:30px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.02)}.num:active{transform:scale(.96);background:#e5e9ef}.num.chosen{background:#dceaff;color:#2b65b7;box-shadow:inset 0 0 0 2px var(--blue)}.num.used{opacity:.28}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 4px 0}.tool{border:0;background:transparent;color:#5d6674;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;cursor:pointer}.toolicon{width:54px;height:54px;border-radius:50%;background:#eceff3;display:grid;place-items:center;font-size:24px;color:#28303b}.tool.hint .toolicon{color:#e5a12f;position:relative}.badge{position:absolute;right:-2px;top:-2px;background:var(--blue);color:white;border-radius:999px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font-size:11px;font-weight:800}.footeractions{display:flex;justify-content:center;gap:10px;margin:18px 0 0}.minibtn{border:0;background:#fff;border-radius:999px;padding:10px 14px;color:#667085;box-shadow:0 2px 10px rgba(0,0,0,.05);cursor:pointer}.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 34%,rgba(203,150,80,.26),transparent 24%),radial-gradient(circle at 18% 22%,rgba(125,33,47,.42),transparent 36%),linear-gradient(135deg,#09080a,#1b0d12 54%,#0b090a);opacity:0;pointer-events:none;transition:.4s;overflow:hidden}.celebrate.show{opacity:1;pointer-events:auto}.celebrate:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(118deg,transparent 0 48px,rgba(224,190,123,.035) 49px,transparent 51px 105px);transform:rotate(-8deg)}.card{position:relative;z-index:2;width:min(680px,100%);padding:46px 28px 34px;border-radius:32px;border:1px solid rgba(230,199,142,.2);background:rgba(17,12,15,.67);backdrop-filter:blur(18px);color:#f8efe6;text-align:center;box-shadow:0 40px 110px rgba(0,0,0,.45)}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#d8b97e}.card h2{font-family:Georgia,serif;font-size:clamp(42px,12vw,78px);line-height:.96;letter-spacing:-.05em;font-weight:400;margin:18px 0}.card h2 em{display:block;color:#d5b272;font-weight:400}.card p{max-width:540px;margin:auto;color:#cfbec6;line-height:1.6}.result{margin-top:18px;color:#f4e8d7}.cactions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}.cactions button{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#fff}.cactions .go{background:#c6a066;color:#19120c;border:0;font-weight:750}.petal{position:absolute;top:-28px;width:6px;height:18px;border-radius:99px;background:linear-gradient(#d6b777,#7d2634);animation:fall linear infinite}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(720deg)}}@media(max-width:520px){body{padding-left:8px;padding-right:8px}.topbar{grid-template-columns:58px 1fr 58px;margin-bottom:14px}.round{width:50px;height:50px;font-size:24px}.date{font-size:19px}.timer{font-size:18px}.statusrow{margin-left:0;margin-right:0}.streak{font-size:12px}.level{font-size:15px;padding:8px 32px 8px 13px}.lives{gap:4px}.bolt{font-size:18px}.board{border-radius:14px}.nums{grid-template-columns:repeat(5,1fr);gap:7px;margin-left:0;margin-right:0}.num{min-height:58px;border-radius:15px;font-size:26px}.tools{margin-left:0;margin-right:0}}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><button class="round" id="resetBtn">⌄</button><div class="meta"><div class="date" id="dateLabel">Сегодня</div><div class="timer"><span class="clock"></span><span id="time">00:00</span></div></div><button class="round right" id="settingsBtn">⚙︎</button></div>
<div class="statusrow"><div class="streak"><b>♛</b><span>Серия: <strong id="streak">0</strong></span></div><div class="levelwrap"><select id="level" class="level"><option value="easy">Лёгкий</option><option value="medium" selected>Средний</option><option value="hard">Сложный</option></select></div><div class="lives" id="lives"><span class="bolt">⚡</span><span class="bolt">⚡</span><span class="bolt">⚡</span><span class="bolt">⚡</span></div></div>
<div id="board" class="board"></div><div id="msg" class="error-note"></div><div id="nums" class="nums"></div>
<div class="tools"><button class="tool" id="undo"><span class="toolicon">↶</span><span>Отменить</span></button><button class="tool" id="erase"><span class="toolicon">⌫</span><span>Стереть</span></button><button class="tool hint" id="hint"><span class="toolicon">💡<span class="badge" id="hintCount">4</span></span><span>Подсказка</span></button></div><div class="footeractions"><button class="minibtn" id="newGame">Новая игра</button></div>
</div>
<div id="celebrate" class="celebrate" aria-hidden="true"><div class="card"><div class="eyebrow">Tango anniversary</div><h2>С годовщиной <em>в танго!</em></h2><p>Пусть впереди будет ещё больше музыки, объятий, точных шагов и тех самых танцев, после которых хочется остаться ещё на одну танду.</p><div id="result" class="result"></div><div class="cactions"><button id="again" class="go">Сыграть ещё</button><button id="back">Вернуться к полю</button></div></div></div>
<script>
const P={easy:[['530070000600195000098000060800060003400803001700020006060000280000419005000080079','534678912672195348198342567859761423426853791713924856961537284287419635345286179'],['000260701680070090190004500820100040004602900050003028009300074040050036703018000','435269781682571493197834562826195347374682915951743628519326874248957136763418259']],medium:[['000000907000420180000705026100904000050000040000507009920108000034059000507000000','483651927659423187271795326168934752752819643349567819925178364834259671517346298'],['030000080009000500007509200700105008020090030400802001004207100002000800090000060','235416789149728536867539214793165428821974635456382971584297163612653897397841652']],hard:[['000000010400000000020000000000050407008000300001090000300400200050100000000806000','693784512487512936125963874932651487568247391741398625319475268856129743274836159'],['000900002050123400030000160908000000070000090000000205091000050007359040400007000','146978532859123476732546189928735614573214698614698275391462857287359941465817323']]};
const $=id=>document.getElementById(id);const board=$('board'),timeEl=$('time'),msg=$('msg'),celebrate=$('celebrate');let puzzle='',solution='',vals=[],sel=-1,sec=0,timer=null,started=false,done=false;let mistakes=0,hints=4,history=[],streak=0,wrongCells=new Set(),activeNumber=null;const d=new Date();$('dateLabel').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='num';b.textContent=n;b.dataset.n=n;b.onclick=()=>{activeNumber=n;document.querySelectorAll('.num').forEach(x=>x.classList.toggle('chosen',x===b));draw();if(sel>=0&&puzzle[sel]==='0')put(n)};$('nums').appendChild(b)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(){if(started||done)return;started=true;timer=setInterval(()=>{if(!done){sec++;timeEl.textContent=fmt(sec)}},1000)}function flash(text,good=false){msg.textContent=text;msg.className='error-note'+(good?' ok':'');clearTimeout(flash.t);flash.t=setTimeout(()=>{if(!done){msg.textContent='';msg.className='error-note'}},1400)}
function newGame(){clearInterval(timer);const pool=P[$('level').value],pick=pool[Math.floor(Math.random()*pool.length)];puzzle=pick[0];solution=pick[1];vals=[...puzzle].map(v=>v==='0'?'':v);sel=-1;sec=0;started=false;done=false;mistakes=0;hints=4;history=[];activeNumber=null;wrongCells.clear();timeEl.textContent='00:00';$('hintCount').textContent=hints;celebrate.classList.remove('show');document.querySelectorAll('.num').forEach(x=>x.classList.remove('chosen'));draw();updateLives();updateNums();msg.textContent=''}
function draw(){board.innerHTML='';vals.forEach((v,i)=>{const r=Math.floor(i/9),c=i%9,btn=document.createElement('button');btn.className='cell'+(puzzle[i]!=='0'?' fixed':v?' user':'');btn.dataset.r=r;btn.dataset.c=c;btn.textContent=v;if(sel>=0){const sr=Math.floor(sel/9),sc=sel%9,sameBox=Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3);if(r===sr||c===sc||sameBox)btn.classList.add('rel');if(i===sel)btn.classList.add('sel');if(vals[sel]&&v===vals[sel])btn.classList.add('same')}if(activeNumber&&v===String(activeNumber))btn.classList.add('same');if(wrongCells.has(i))btn.classList.add('err');btn.onclick=()=>{sel=i;if(v){activeNumber=Number(v);document.querySelectorAll('.num').forEach(x=>x.classList.toggle('chosen',Number(x.dataset.n)===activeNumber))}startTimer();draw()};board.appendChild(btn)})}
function updateLives(){[...$('lives').children].forEach((b,i)=>b.classList.toggle('lost',i<mistakes))}function updateNums(){for(let n=1;n<=9;n++){const count=vals.filter(v=>v===String(n)).length;document.querySelector('.num[data-n="'+n+'"]').classList.toggle('used',count>=9)}}
function put(n){if(done||sel<0||puzzle[sel]!=='0')return;startTimer();history.push({i:sel,prev:vals[sel],wrong:wrongCells.has(sel)});vals[sel]=String(n);activeNumber=Number(n);document.querySelectorAll('.num').forEach(x=>x.classList.toggle('chosen',Number(x.dataset.n)===activeNumber));if(String(n)!==solution[sel]){wrongCells.add(sel);mistakes=Math.min(4,mistakes+1);updateLives();flash('Эта цифра сюда не подходит');if(navigator.vibrate)navigator.vibrate(45)}else{wrongCells.delete(sel);flash('Верно',true)}draw();updateNums();if(vals.every(Boolean)&&wrongCells.size===0)finish()}
function erase(){if(sel<0||puzzle[sel]!=='0')return;history.push({i:sel,prev:vals[sel],wrong:wrongCells.has(sel)});vals[sel]='';wrongCells.delete(sel);draw();updateNums()}function undo(){const h=history.pop();if(!h)return;vals[h.i]=h.prev;sel=h.i;if(h.wrong)wrongCells.add(h.i);else wrongCells.delete(h.i);draw();updateNums()}function hint(){if(done||hints<=0)return;let target=sel;if(target<0||puzzle[target]!=='0'||(vals[target]===solution[target]&&!wrongCells.has(target)))target=vals.findIndex((v,i)=>puzzle[i]==='0'&&v!==solution[i]);if(target<0)return;history.push({i:target,prev:vals[target],wrong:wrongCells.has(target)});vals[target]=solution[target];wrongCells.delete(target);sel=target;activeNumber=Number(solution[target]);document.querySelectorAll('.num').forEach(x=>x.classList.toggle('chosen',Number(x.dataset.n)===activeNumber));hints--;$('hintCount').textContent=hints;flash('Подсказка поставила правильную цифру',true);draw();updateNums();if(vals.every(Boolean)&&wrongCells.size===0)finish()}
function finish(){done=true;clearInterval(timer);streak++;$('streak').textContent=streak;$('result').textContent='Судоку решено за '+fmt(sec)+'.';spawnPetals();celebrate.classList.add('show');celebrate.setAttribute('aria-hidden','false')}function spawnPetals(){celebrate.querySelectorAll('.petal').forEach(x=>x.remove());for(let i=0;i<28;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(5+Math.random()*6)+'s';p.style.animationDelay=(-Math.random()*5)+'s';p.style.setProperty('--x',(-110+Math.random()*220)+'px');celebrate.appendChild(p)}}
$('erase').onclick=erase;$('undo').onclick=undo;$('hint').onclick=hint;$('newGame').onclick=newGame;$('resetBtn').onclick=newGame;$('level').onchange=newGame;$('settingsBtn').onclick=()=>{$('level').focus();$('level').click?.()};$('again').onclick=newGame;$('back').onclick=()=>celebrate.classList.remove('show');document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)){activeNumber=Number(e.key);document.querySelectorAll('.num').forEach(x=>x.classList.toggle('chosen',Number(x.dataset.n)===activeNumber));draw();if(sel>=0&&puzzle[sel]==='0')put(e.key)}if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')erase();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z')undo()});newGame();
</script>
</body>
</html>
